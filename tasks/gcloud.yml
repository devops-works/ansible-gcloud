- name: Ensures apt keyrings directory exists
  ansible.builtin.file:
    path: /etc/apt/keyrings
    state: directory
    mode: '0755'

# The URL serves an ASCII-armored key, hence the .asc extension: apt 3.0
# (Debian 13) rejects armored content stored in a .gpg file.
- name: Download gcloud GPG key
  ansible.builtin.get_url:
    url: https://packages.cloud.google.com/apt/doc/apt-key.gpg
    dest: /etc/apt/keyrings/cloud.google.asc
    mode: '0644'
    force: true

# A leftover armored key here makes apt ignore the keyring and breaks *all*
# repositories, so it has to go before any cache update.
- name: Removes legacy gcloud key from trusted.gpg.d
  ansible.builtin.file:
    path: /etc/apt/trusted.gpg.d/cloud.google.gpg
    state: absent

- name: Installs deb822_repository requirements
  ansible.builtin.apt:
    pkg: python3-debian
    state: present
  when: not ansible_check_mode

- name: Adds gcloud repos
  ansible.builtin.deb822_repository:
    name: packages_cloud_google_com_apt
    types: deb
    uris: https://packages.cloud.google.com/apt
    suites: cloud-sdk
    components: main
    signed_by: /etc/apt/keyrings/cloud.google.asc
    state: present
    enabled: true

# deb822_repository writes a .sources file; drop the one-line list the
# previous apt_repository-based versions of this role left behind.
- name: Removes legacy gcloud sources.list entry
  ansible.builtin.file:
    path: /etc/apt/sources.list.d/packages_cloud_google_com_apt.list
    state: absent

- name: Installs google-cloud-cli
  ansible.builtin.apt:
    pkg: google-cloud-cli
    state: present
    update_cache: true
  when: not ansible_check_mode

- name: Installs google-cloud-sdk extras
  ansible.builtin.apt:
    pkg: "{{ gcloud_extras }}"
    state: present
  when: not ansible_check_mode